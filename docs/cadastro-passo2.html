<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro DeGustte - Passo 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #FF6B35;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .form-wrapper {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin-bottom: 10px;
            text-align: center;
        }

        .form-subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 16px;
            text-align: center;
        }

        .progress {
            background: #f0f0f0;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            background: #FF6B35;
            height: 100%;
            width: 66%;
            transition: width 0.3s;
        }

        .planos-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .plano {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .plano:hover {
            border-color: #FF6B35;
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.15);
        }

        .plano.selecionado {
            border-color: #FF6B35;
            background: #FFF5F0;
        }

        .plano input[type="radio"] {
            display: none;
        }

        .plano-titulo {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 15px;
        }

        .plano-preco {
            font-size: 32px;
            font-weight: 700;
            color: #FF6B35;
            margin-bottom: 20px;
        }

        .plano-preco-periodo {
            font-size: 14px;
            color: #666;
        }

        .plano-features {
            list-style: none;
            margin-bottom: 30px;
        }

        .plano-features li {
            padding: 10px 0;
            color: #555;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        .plano-features li:before {
            content: "✓ ";
            color: #FF6B35;
            font-weight: 700;
            margin-right: 8px;
        }

        .plano-qr {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .plano-qr img {
            width: 150px;
            height: 150px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .plano-qr-texto {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: #FF6B35;
            color: white;
            min-width: 200px;
        }

        .btn-submit:hover:not(:disabled) {
            background: #E55A25;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 53, 0.2);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-voltar {
            background: #f0f0f0;
            color: #1a1a1a;
        }

        .btn-voltar:hover {
            background: #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #FF6B35;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .planos-container {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">DeGustte</div>
            <p class="subtitle">Passo 2: Escolha seu Plano</p>
        </header>

        <div class="form-wrapper">
            <div class="progress">
                <div class="progress-bar"></div>
            </div>

            <h1>Escolha o Melhor Plano para Você</h1>
            <p class="form-subtitle">Selecione o plano ideal para seu negócio</p>

            <form id="planosForm">
                <div class="planos-container">
                    <!-- Plano Essencial -->
                    <label class="plano" id="planoEssencial">
                        <input type="radio" name="plano" value="essencial" required>
                        <div class="plano-titulo">Essencial</div>
                        <div class="plano-preco">
                            R$ 50,90
                            <div class="plano-preco-periodo">/mês</div>
                        </div>

                        <ul class="plano-features">
                            <li>Cardápio Digital</li>
                            <li>Link personalizado</li>
                            <li>QR Code exclusivo</li>
                            <li>Perfil personalizado</li>
                            <li>Categorias e produtos</li>
                            <li>Edição em tempo real</li>
                            <li>Fotos e vídeos dos produtos</li>
                            <li>Produtos em destaque</li>
                            <li>Integração com Whatsapp</li>
                            <li>Suporte</li>
                        </ul>
                    </label>

                    <!-- Plano Extreme -->
                    <label class="plano" id="planoExtreme">
                        <input type="radio" name="plano" value="extreme" required>
                        <div class="plano-titulo">Extreme</div>
                        <div class="plano-preco">
                            R$ 90,90
                            <div class="plano-preco-periodo">/mês</div>
                        </div>

                        <ul class="plano-features">
                            <li>Cardápio Digital</li>
                            <li>Link personalizado</li>
                            <li>QR Code exclusivo</li>
                            <li>Perfil personalizado</li>
                            <li>Categorias e produtos</li>
                            <li>Edição em tempo real</li>
                            <li>Fotos e vídeos dos produtos</li>
                            <li>Produtos em destaque</li>
                            <li>Suporte</li>
                            <li>Sistema de Reservas</li>
                            <li>Mapa das Mesas</li>
                            <li>Integração com Whatsapp</li>
                        </ul>
                    </label>
                </div>

                <div class="buttons">
                    <button type="button" class="btn-voltar" onclick="window.history.back()">Voltar</button>
                    <button type="submit" class="btn-submit" id="submitBtn">Confirmar Plano</button>
                </div>
            </form>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Redirecionando para o WhatsApp...</p>
            </div>
        </div>
    </div>

    <script src="/admin/js/sync-empresas.js"></script>
    <script>
        const form = document.getElementById('planosForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const planoEssencial = document.getElementById('planoEssencial');
        const planoExtreme = document.getElementById('planoExtreme');

        const radios = document.querySelectorAll('input[name="plano"]');

        radios.forEach(radio => {
            radio.addEventListener('change', () => {
                planoEssencial.classList.remove('selecionado');
                planoExtreme.classList.remove('selecionado');

                if (radio.value === 'essencial') {
                    planoEssencial.classList.add('selecionado');
                } else {
                    planoExtreme.classList.add('selecionado');
                }
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.style.display = 'none';
            loading.style.display = 'block';

            try {
                const planoSelecionado = document.querySelector('input[name="plano"]:checked').value;
                const passo1Data = JSON.parse(localStorage.getItem('passo1Data') || '{}');

                let linkPagamento, nomePlano, preco;

                if (planoSelecionado === 'essencial') {
                    linkPagamento = 'https://nubank.com.br/cobrar/np8tk/6a8d0805-f4db-49af-a25d-170807f2ca93';
                    nomePlano = 'Essencial';
                    preco = 'R$ 50,90';
                } else {
                    linkPagamento = 'https://nubank.com.br/cobrar/np8tk/6a8d081e-e42f-4fef-844e-e1bca8405152';
                    nomePlano = 'Extreme';
                    preco = 'R$ 90,90';
                }

                // Mensagem WhatsApp
                const mensagem = `Olá! Gostaria de confirmar meu cadastro no DeGustte.\n\nEmpresa: ${passo1Data.nomeEmpresa}\nResponsável: ${passo1Data.nomeResponsavel}\nPlano: ${nomePlano} (${preco}/mês)\n\nLink de pagamento: ${linkPagamento}\n\nEstou enviando o comprovante em seguida.`;

                const numeroWhatsApp = '5538992428010';
                const urlWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;

                // Salvar dados
                localStorage.setItem('planoSelecionado', planoSelecionado);
                localStorage.setItem('linkPagamento', linkPagamento);

                // Sincronizar com painel admin (salva empresa)
                salvarEmpresaFromCadastro(passo1Data, planoSelecionado);

                // Redirecionar para WhatsApp
                setTimeout(() => {
                    window.location.href = urlWhatsApp;
                }, 1000);

            } catch (erro) {
                alert('Erro: ' + erro.message);
                submitBtn.style.display = 'block';
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
