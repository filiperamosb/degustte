<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - DeGustte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .plano-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .plano-card {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .plano-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .plano-card.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .plano-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .plano-card p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .preco {
            color: #27ae60;
            font-weight: bold;
            font-size: 1.2em;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        button:hover {
            background: #764ba2;
        }

        .success {
            background: #27ae60;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
        }

        @media (max-width: 600px) {
            .two-columns, .plano-selector {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ DeGustte</h1>
        <p class="subtitle">Cadastro de Restaurante</p>

        <div class="success" id="successMsg"></div>
        <div class="error" id="errorMsg"></div>

        <form id="cadastroForm">
            <h3 style="color: #667eea; margin: 20px 0 15px 0;">📋 Dados do Restaurante</h3>

            <div class="form-group">
                <label>Nome do Restaurante *</label>
                <input type="text" name="nomeEmpresa" required>
            </div>

            <div class="two-columns">
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Telefone *</label>
                    <input type="text" name="telefone" placeholder="(11) 99999-9999" required>
                </div>
            </div>

            <div class="two-columns">
                <div class="form-group">
                    <label>CNPJ *</label>
                    <input type="text" name="cnpj" placeholder="00.000.000/0000-00" required>
                </div>
                <div class="form-group">
                    <label>Tipo de Negócio *</label>
                    <select name="tipo" required>
                        <option value="">Selecione</option>
                        <option value="restaurante">Restaurante</option>
                        <option value="pizzaria">Pizzaria</option>
                        <option value="lanchonete">Lanchonete</option>
                        <option value="padaria">Padaria</option>
                        <option value="cafe">Café</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>
            </div>

            <h3 style="color: #667eea; margin: 30px 0 15px 0;">👤 Dados do Responsável</h3>

            <div class="form-group">
                <label>Nome Completo *</label>
                <input type="text" name="nomeResponsavel" required>
            </div>

            <div class="two-columns">
                <div class="form-group">
                    <label>CPF *</label>
                    <input type="text" name="cpf" placeholder="000.000.000-00" required>
                </div>
                <div class="form-group">
                    <label>Data de Nascimento *</label>
                    <input type="date" name="dataNascimento" required>
                </div>
            </div>

            <div class="two-columns">
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="emailResponsavel" required>
                </div>
                <div class="form-group">
                    <label>Telefone *</label>
                    <input type="text" name="telefoneResponsavel" required>
                </div>
            </div>

            <h3 style="color: #667eea; margin: 30px 0 15px 0;">💳 Escolha seu Plano</h3>

            <div class="plano-selector" id="planos">
                <div class="plano-card" onclick="selecionarPlano(this, 'basico')">
                    <h3>Básico</h3>
                    <p>Perfeito para começar</p>
                    <div class="preco">R$ 29,90/mês</div>
                </div>
                <div class="plano-card" onclick="selecionarPlano(this, 'profissional')">
                    <h3>Profissional</h3>
                    <p>Recomendado</p>
                    <div class="preco">R$ 59,90/mês</div>
                </div>
                <div class="plano-card" onclick="selecionarPlano(this, 'premium')">
                    <h3>Premium</h3>
                    <p>Completo</p>
                    <div class="preco">R$ 99,90/mês</div>
                </div>
            </div>

            <input type="hidden" name="plano" id="planoSelecionado" required>

            <button type="submit">✓ Criar Cadastro</button>
            <div class="loading" id="loading">Processando...</div>
        </form>
    </div>

    <script>
        const API_URL = 'http://167.114.30.91:3000/api';

        function selecionarPlano(elemento, plano) {
            document.querySelectorAll('.plano-card').forEach(e => e.classList.remove('selected'));
            elemento.classList.add('selected');
            document.getElementById('planoSelecionado').value = plano;
        }

        document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(document.getElementById('cadastroForm'));
            const dados = Object.fromEntries(formData);

            if (!dados.plano) {
                showError('Selecione um plano!');
                return;
            }

            try {
                document.getElementById('loading').style.display = 'block';

                const response = await fetch(`${API_URL}/empresas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const result = await response.json();

                if (result.ok) {
                    showSuccess('Cadastro criado com sucesso! Aguarde aprovação.');
                    document.getElementById('cadastroForm').reset();
                    document.querySelectorAll('.plano-card').forEach(e => e.classList.remove('selected'));
                } else {
                    showError(result.erro || 'Erro ao criar cadastro');
                }
            } catch (error) {
                console.error('Erro:', error);
                showError('Erro ao conectar. Tente novamente.');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });

        function showSuccess(msg) {
            const div = document.getElementById('successMsg');
            div.textContent = msg;
            div.style.display = 'block';
        }

        function showError(msg) {
            const div = document.getElementById('errorMsg');
            div.textContent = msg;
            div.style.display = 'block';
            setTimeout(() => div.style.display = 'none', 5000);
        }
    </script>
</body>
</html>
