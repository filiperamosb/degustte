<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeGustte - Painel Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FF6B35 0%, #E74C3C 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            padding: 50px 40px;
            text-align: center;
        }

        .logo {
            font-size: 40px;
            font-weight: 700;
            color: #FF6B35;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #1a1a1a;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #FF6B35;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FF6B35 0%, #E74C3C 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 53, 0.3);
        }

        .error {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .info {
            background: #e3f2fd;
            border: 1px solid #90caf9;
            color: #1565c0;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">DeGustte</div>
        <h1>Painel Admin</h1>
        <p class="subtitle">Acesse sua conta</p>

        <div class="info">
            💡 Use: admin@degustte.com / admin123
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    value="admin@degustte.com"
                    required
                >
                <div class="error" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="sua senha"
                    value="admin123"
                    required
                >
                <div class="error" id="senhaError"></div>
            </div>

            <button type="submit">Acessar Painel</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            // Validação simples (em produção, usar backend)
            if (email === 'admin@degustte.com' && senha === 'admin123') {
                // Salvar sessão
                localStorage.setItem('adminLogado', JSON.stringify({
                    email: email,
                    nome: 'Administrador',
                    loginTime: new Date().toISOString()
                }));

                // Redirecionar para dashboard
                window.location.href = '/admin/dashboard.html';
            } else {
                document.getElementById('emailError').style.display = 'block';
                document.getElementById('emailError').textContent = 'Email ou senha incorretos';
            }
        });
    </script>
</body>
</html>
