# ============================
# DeGustte Nginx Configuration
# ============================
# Salvar em: /etc/nginx/sites-available/degustte

upstream degustte_backend {
  server localhost:3000;
  keepalive 64;
}

# Redirect HTTP to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name degustte.com.br www.degustte.com.br;

  location / {
    return 301 https://$server_name$request_uri;
  }

  # Let's Encrypt validation
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
}

# HTTPS Server
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name degustte.com.br www.degustte.com.br;

  # SSL Certificates (Let's Encrypt)
  ssl_certificate /etc/letsencrypt/live/degustte.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/degustte.com.br/privkey.pem;

  # SSL Configuration
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Security Headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # Gzip Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

  # Root directory
  root /var/www/degustte/public;
  index index.html;

  # Static files
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Static HTML files
  location / {
    try_files $uri $uri/ @backend;
  }

  # 404 handler (para rotas dinâmicas de empresas)
  error_page 404 =200 /404.html;
  location = /404.html {
    internal;
  }

  # API Backend
  location /api/ {
    proxy_pass http://degustte_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_buffering off;
  }

  # Admin panel
  location /admin/ {
    try_files $uri $uri/ /admin/dashboard.html;
  }

  # Backend fallback
  location @backend {
    proxy_pass http://degustte_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Deny access to sensitive files
  location ~ /\. {
    deny all;
  }

  location ~ ~$ {
    deny all;
  }
}
