<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro DeGustte - Passo 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #FF6B35;
            margin-bottom: 10px;
        }

        .logo img {
            height: 50px;
            margin-right: 10px;
            vertical-align: middle;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .form-wrapper {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .form-subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .progress {
            background: #f0f0f0;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            background: #FF6B35;
            height: 100%;
            width: 33%;
            transition: width 0.3s;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #1a1a1a;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #FF6B35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .required {
            color: #FF6B35;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        button {
            flex: 1;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: #FF6B35;
            color: white;
        }

        .btn-submit:hover:not(:disabled) {
            background: #E55A25;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 53, 0.2);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-voltar {
            background: #f0f0f0;
            color: #1a1a1a;
        }

        .btn-voltar:hover {
            background: #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #FF6B35;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .form-wrapper {
                padding: 25px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="https://i.ibb.co/rfHMWNkf/degusste.png" alt="DeGustte">
                DeGustte
            </div>
            <p class="subtitle">Passo 1: Informações Básicas</p>
        </header>

        <div class="form-wrapper">
            <div class="progress">
                <div class="progress-bar"></div>
            </div>

            <h1>Registre sua Empresa</h1>
            <p class="form-subtitle">Preencha os dados abaixo para começar (Passo 1 de 3)</p>

            <div id="errorMessage" class="error-message"></div>

            <form id="empresaForm">
                <!-- Informações da Empresa -->
                <div class="form-section">
                    <div class="section-title">Dados da Empresa</div>

                    <div class="form-group">
                        <label for="nomeEmpresa">Nome da Empresa <span class="required">*</span></label>
                        <input type="text" id="nomeEmpresa" name="nomeEmpresa"
                               placeholder="Ex: Restaurante Alameda 22" value="Restaurante Alameda 22" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email <span class="required">*</span></label>
                            <input type="email" id="email" name="email"
                                   placeholder="empresa@email.com" value="contato@alameda.com" required>
                        </div>
                        <div class="form-group">
                            <label for="telefone">Telefone <span class="required">*</span></label>
                            <input type="tel" id="telefone" name="telefone"
                                   placeholder="(11) 9999-9999" value="(11) 98765-4321" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="cnpj">CNPJ</label>
                            <input type="text" id="cnpj" name="cnpj"
                                   placeholder="00.000.000/0000-00" value="12.345.678/0001-90">
                        </div>
                        <div class="form-group">
                            <label for="tipo">Tipo <span class="required">*</span></label>
                            <select id="tipo" name="tipo" required>
                                <option value="">Selecione</option>
                                <option value="restaurante" selected>Restaurante</option>
                                <option value="bar">Bar</option>
                                <option value="pizzaria">Pizzaria</option>
                                <option value="lanchonete">Lanchonete</option>
                                <option value="cafe">Café</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Dados do Responsável -->
                <div class="form-section">
                    <div class="section-title">Dados do Responsável</div>

                    <div class="form-group">
                        <label for="nomeResponsavel">Nome Completo <span class="required">*</span></label>
                        <input type="text" id="nomeResponsavel" name="nomeResponsavel"
                               placeholder="João Silva Santos" value="João Silva Santos" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="cpf">CPF <span class="required">*</span></label>
                            <input type="text" id="cpf" name="cpf"
                                   placeholder="000.000.000-00" value="123.456.789-10" required>
                        </div>
                        <div class="form-group">
                            <label for="dataNascimento">Data de Nascimento <span class="required">*</span></label>
                            <input type="date" id="dataNascimento" name="dataNascimento" value="1990-05-15" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="telefoneResponsavel">Telefone <span class="required">*</span></label>
                            <input type="tel" id="telefoneResponsavel" name="telefoneResponsavel"
                                   placeholder="(11) 99999-9999" value="(11) 98765-4321" required>
                        </div>
                        <div class="form-group">
                            <label for="emailResponsavel">Email para Faturas <span class="required">*</span></label>
                            <input type="email" id="emailResponsavel" name="emailResponsavel"
                                   placeholder="email@exemplo.com" value="joao@alameda.com" required>
                        </div>
                    </div>
                </div>

                <!-- Botões -->
                <div class="buttons">
                    <button type="button" class="btn-voltar" onclick="window.history.back()">Voltar</button>
                    <button type="submit" class="btn-submit" id="submitBtn">Continuar para Pagamento</button>
                </div>
            </form>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Processando seu cadastro...</p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('empresaForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.style.display = 'none';
            loading.style.display = 'block';
            errorMessage.style.display = 'none';

            try {
                const formData = new FormData(form);
                const dados = Object.fromEntries(formData);

                // Enviar para o backend
                const response = await fetch(
                    'http://localhost:3000/api/create-preference',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            nomeEmpresa: dados.nomeEmpresa,
                            email: dados.emailResponsavel,
                            valor: 1.00,
                            dados: dados
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error('Erro ao criar preferência de pagamento');
                }

                const result = await response.json();

                if (result.initPoint) {
                    // Abrir MercadoPago em nova aba
                    window.open(result.initPoint, '_blank');

                    // Salvar referência para polling
                    localStorage.setItem('paymentReference', dados.nomeEmpresa);

                    // Mostrar mensagem de espera
                    errorMessage.style.display = 'block';
                    errorMessage.innerHTML = '⏳ Janela de pagamento aberta. Aguardando confirmação...';
                    errorMessage.style.backgroundColor = '#d4edda';
                    errorMessage.style.borderColor = '#c3e6cb';
                    errorMessage.style.color = '#155724';

                    // Fazer polling para verificar pagamento
                    let pollCount = 0;
                    const pollInterval = setInterval(async () => {
                        pollCount++;
                        try {
                            const checkResponse = await fetch(
                                'http://localhost:3000/api/check-payment?reference=' + encodeURIComponent(dados.nomeEmpresa)
                            );
                            const checkResult = await checkResponse.json();

                            if (checkResult.approved) {
                                clearInterval(pollInterval);
                                window.location.href = '/sucesso.html';
                            }
                        } catch (e) {
                            console.log('Polling...', pollCount);
                        }

                        // Parar polling após 15 minutos
                        if (pollCount > 450) {
                            clearInterval(pollInterval);
                        }
                    }, 2000);
                } else {
                    throw new Error('Link de pagamento não recebido');
                }

            } catch (erro) {
                console.error('Erro:', erro);
                errorMessage.style.display = 'block';
                errorMessage.innerHTML = `❌ ${erro.message}`;
                submitBtn.style.display = 'block';
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
