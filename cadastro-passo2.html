<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro DeGustte - Passo 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #FF6B35;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .form-wrapper {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .form-subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .progress {
            background: #f0f0f0;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            background: #FF6B35;
            height: 100%;
            width: 66%;
            transition: width 0.3s;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #1a1a1a;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="file"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #FF6B35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .required {
            color: #FF6B35;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        button {
            flex: 1;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: #FF6B35;
            color: white;
        }

        .btn-submit:hover:not(:disabled) {
            background: #E55A25;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 53, 0.2);
        }

        .btn-voltar {
            background: #f0f0f0;
            color: #1a1a1a;
        }

        .btn-voltar:hover {
            background: #e0e0e0;
        }

        .file-input-label {
            display: inline-block;
            padding: 10px 20px;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            color: #FF6B35;
            transition: background 0.3s;
        }

        .file-input-label:hover {
            background: #e0e0e0;
        }

        input[type="file"] {
            display: none;
        }

        .file-name {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        @media (max-width: 768px) {
            .form-wrapper {
                padding: 25px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">DeGustte</div>
            <p class="subtitle">Passo 2: Informações da Empresa</p>
        </header>

        <div class="form-wrapper">
            <div class="progress">
                <div class="progress-bar"></div>
            </div>

            <h1>Informações da Empresa</h1>
            <p class="form-subtitle">Adicione endereço e identidade visual (Passo 2 de 3)</p>

            <form id="passo2Form">
                <!-- Endereço -->
                <div class="form-section">
                    <div class="section-title">Endereço</div>

                    <div class="form-group">
                        <label for="rua">Rua <span class="required">*</span></label>
                        <input type="text" id="rua" name="rua" placeholder="Ex: Rua das Flores" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="numero">Número <span class="required">*</span></label>
                            <input type="text" id="numero" name="numero" placeholder="Ex: 123" required>
                        </div>
                        <div class="form-group">
                            <label for="complemento">Complemento</label>
                            <input type="text" id="complemento" name="complemento" placeholder="Ex: Apto 45">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="cidade">Cidade <span class="required">*</span></label>
                            <input type="text" id="cidade" name="cidade" placeholder="Ex: São Paulo" required>
                        </div>
                        <div class="form-group">
                            <label for="estado">Estado <span class="required">*</span></label>
                            <input type="text" id="estado" name="estado" placeholder="Ex: SP" maxlength="2" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="cep">CEP <span class="required">*</span></label>
                        <input type="text" id="cep" name="cep" placeholder="Ex: 01234-567" required>
                    </div>
                </div>

                <!-- Identidade Visual -->
                <div class="form-section">
                    <div class="section-title">Identidade Visual</div>

                    <div class="form-group">
                        <label for="logo">Logo da Empresa</label>
                        <label for="logoFile" class="file-input-label">Selecionar arquivo</label>
                        <input type="file" id="logoFile" name="logo" accept="image/*">
                        <div class="file-name" id="logoName"></div>
                    </div>

                    <div class="form-group">
                        <label for="banner">Banner/Foto de Capa</label>
                        <label for="bannerFile" class="file-input-label">Selecionar arquivo</label>
                        <input type="file" id="bannerFile" name="banner" accept="image/*">
                        <div class="file-name" id="bannerName"></div>
                    </div>

                    <div class="form-group">
                        <label for="corPrincipal">Cor Principal</label>
                        <input type="text" id="corPrincipal" name="corPrincipal" placeholder="Ex: #FF6B35">
                    </div>
                </div>

                <!-- Sobre -->
                <div class="form-section">
                    <div class="section-title">Sobre sua Empresa</div>

                    <div class="form-group">
                        <label for="descricao">Descrição <span class="required">*</span></label>
                        <textarea id="descricao" name="descricao" placeholder="Descreva seu estabelecimento..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="horarios">Horários de Funcionamento</label>
                        <input type="text" id="horarios" name="horarios" placeholder="Ex: Seg-Dom 11:00-23:00">
                    </div>
                </div>

                <!-- Botões -->
                <div class="buttons">
                    <button type="button" class="btn-voltar" onclick="window.history.back()">Voltar</button>
                    <button type="submit" class="btn-submit">Continuar para Pagamento</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('passo2Form');
        const logoFile = document.getElementById('logoFile');
        const bannerFile = document.getElementById('bannerFile');
        const logoName = document.getElementById('logoName');
        const bannerName = document.getElementById('bannerName');

        logoFile.addEventListener('change', (e) => {
            logoName.textContent = e.target.files[0]?.name || '';
        });

        bannerFile.addEventListener('change', (e) => {
            bannerName.textContent = e.target.files[0]?.name || '';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            try {
                const formData = new FormData(form);
                const passo2Data = Object.fromEntries(formData);

                // Recuperar dados do Passo 1
                const passo1Data = JSON.parse(localStorage.getItem('passo1Data') || '{}');

                // Combinar dados
                const dadosCompletos = { ...passo1Data, ...passo2Data };

                // Salvar dados do Passo 2
                localStorage.setItem('passo2Data', JSON.stringify(passo2Data));

                // Redirecionar para Passo 3
                window.location.href = '/cadastro-passo3.html';

            } catch (erro) {
                alert('Erro: ' + erro.message);
            }
        });
    </script>
</body>
</html>
